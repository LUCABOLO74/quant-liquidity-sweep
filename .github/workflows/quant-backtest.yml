name: Quant Liquidity Sweep - Backtest

on:
  push:
    branches: [ main, develop ]
  schedule:
    # Esegui ogni domenica sera (dopo chiusura mercati USA)
    #- cron: '0 22 * * 0'  # Domenica ore 22:00 UTC
  workflow_dispatch:     # Esecuzione manuale da GitHub

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy pandas matplotlib yfinance scipy

      - name: Run backtest
        run: python main.py

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: backtest-results
          path: results/quant_research_report.png
          retention-days: 90

      - name: Commit and push results (if changed)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add results/
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update backtest results - $(date +'%Y-%m-%d %H:%M:%S')" && git push)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
